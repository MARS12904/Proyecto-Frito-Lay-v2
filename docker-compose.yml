services:
  laygo:
    build:
      context: ./LayGoProy
      dockerfile: Dockerfile

    container_name: laygo-expo

    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"

    env_file:
      - ./LayGoProy/.env

    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0

    stdin_open: true
    tty: true